<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TalentSignal | GenAI Smart Recruitment & Resume Intelligence</title>
    
    <!-- Favicon & App Icon -->
    <link rel="icon" type="image/svg+xml" href="/static/logo.svg" />
    <link rel="apple-touch-icon" href="/static/logo.svg" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Toastify CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <!-- Tailwind CSS 3 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              brand: {
                50: '#eef2ff',
                100: '#e0e7ff',
                500: '#6366f1',
                600: '#4f46e5',
                700: '#4338ca',
              }
            },
            boxShadow: {
              'card': '0 2px 12px rgba(0, 0, 0, 0.03), 0 1px 3px rgba(0, 0, 0, 0.02)',
              'card-hover': '0 16px 36px -6px rgba(0, 0, 0, 0.08), 0 6px 12px -4px rgba(0, 0, 0, 0.02)',
              'sheet': '0 6px 24px rgba(0, 0, 0, 0.05)',
              'float': '0 20px 40px -10px rgba(79, 70, 229, 0.15)',
            }
          }
        }
      }
    </script>

    <!-- Toastify JS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <!-- React 18 & ReactDOM 18 CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body {
        background-color: #f8fafc;
        font-family: 'Plus Jakarta Sans', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* Custom modern scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* Float animations */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatSlowDelayed {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      .animate-float {
        animation: floatSlow 4s ease-in-out infinite;
      }
      .animate-float-delayed {
        animation: floatSlowDelayed 5s ease-in-out 1.5s infinite;
      }

      /* Keyframe animation for AI Insight spotlight */
      @keyframes insightGlow {
        0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.5); transform: translateY(-2px); }
        50% { box-shadow: 0 0 0 8px rgba(99, 102, 241, 0.2); transform: translateY(-2px); }
        100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); transform: translateY(0); }
      }
      .animate-insight {
        animation: insightGlow 1.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
    </style>
  </head>
  <body class="bg-[#f8fafc] text-slate-800 antialiased min-h-screen">
    <!-- React Root Mount Container -->
    <div id="root" class="min-h-screen w-full flex flex-col"></div>

    <!-- React Application Component -->
    <script type="text/babel" src="/static/app.jsx"></script>
  </body>
</html>
