<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />

  <!-- Document Sheet Corner Accent -->
  <path d="M18 16 H40 L48 24 V48 C48 50.2 46.2 52 44 52 H18 C15.8 52 14 50.2 14 48 V20 C14 17.8 15.8 16 18 16 Z" fill="white" fill-opacity="0.15" />
  <path d="M40 16 V24 H48" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="white" fill-opacity="0.3" />

  <!-- AI Signal Pulse Wave -->
  <path d="M18 36 L25 36 L29 26 L35 44 L39 33 L42 36 L46 36" stroke="url(#pulseGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Signal Node Star -->
  <circle cx="35" cy="44" r="2" fill="#38bdf8" />
  <circle cx="29" cy="26" r="2" fill="#ffffff" />
</svg>
